import_config:
  fields:
    path:
      required: false
      example: "/config/calorplan.json"
      selector:
        text:
    config:
      required: false
      selector:
        object:

run_slot:
  fields:
    room_id:
      required: true
      example: "dormitorio"
      selector:
        text:
    slot_id:
      required: true
      example: "madrugada"
      selector:
        text:
    force:
      required: false
      default: false
      selector:
        boolean:

set_away:
  fields:
    away:
      required: true
      selector:
        boolean:

test_notification:
  fields:
    channel:
      required: true
      example: "telegram"
      selector:
        text:

reload:

set_pause:
  fields:
    room_id:
      required: false
      example: "dormitorio_alba"
      selector:
        text:
    reason:
      required: false
      example: "Vacaciones"
      selector:
        text:
    from:
      required: false
      selector:
        date:
    until:
      required: false
      selector:
        date:
    enabled:
      required: false
      default: true
      selector:
        boolean:

clear_pause:
  fields:
    room_id:
      required: false
      example: "dormitorio_alba"
      selector:
        text:
    reason:
      required: false
      example: "Vacaciones"
      selector:
        text:
    pause_id:
      required: false
      example: "vacaciones"
      selector:
        text:

set_room_enabled:
  fields:
    room_id:
      required: true
      example: "dormitorio_alba"
      selector:
        text:
    enabled:
      required: true
      selector:
        boolean:
