name: HACS

on:
  push:
    branches: [main]  # no se repite con las etiquetas de las releases
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
